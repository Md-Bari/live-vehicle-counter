# Single entry point: dashboard at /, API at /api, live state at /ws, Swagger at /docs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend  { server backend:8001; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2048m;        # video uploads (matches MAX_UPLOAD_MB)

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST + MJPEG stream: no buffering so frames and uploads flow straight through
    location /api/ {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

