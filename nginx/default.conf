# Single entry point: dashboard at /, API at /api, live state at /ws, Swagger at /docs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend  { server backend:8001; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2048m;        # video uploads (matches MAX_UPLOAD_MB)

